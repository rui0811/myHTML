<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>启动主页</title>
  <meta name="theme-color" content="#f6f2fb">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/favicon-64.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="主页">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    /* ---------- 基础 / 主题色 ---------- */
    :root {
      --acc: #5b3f8c;
      --ink: #3f3752;
      --mut: #857b9b;
      --line: rgba(91,63,140,.16);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body,html {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100dvh;
      color: var(--ink);
      font-family: system-ui,-apple-system,"PingFang SC","HarmonyOS Sans SC",MiSans,sans-serif;
      background: radial-gradient(1100px 700px at 50% -15%,#f8f5fc 0,rgba(248,245,252,0) 60%),linear-gradient(180deg,#f3eff8 0,#e8e2f0 100%);
      user-select: none;
      overscroll-behavior-y: contain;
    }

    main {
      max-width: 440px;
      margin: 0 auto;
      padding: 0 20px 40px;
    }

    /* ---------- 顶部：logo、引擎切换、搜索框 ---------- */
    .brand {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 130px;
      padding-top: 42px;
    }

    .brand .logo svg {
      display: block;
    }

    .brand .logo.google svg {
      height: 44px;
      width: 130px;
    }

    .brand .logo.bing svg {
      height: 70px;
      width: 46px;
    }

    .brand .logo.duckduckgo svg {
      height: 64px;
      width: 64px;
    }

    .engines {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .eng {
      border: 1.5px solid var(--line);
      background: 0 0;
      color: #6a5f80;
      border-radius: 999px;
      padding: 10px 20px;
      font-size: 15px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all .2s;
      touch-action: manipulation;
    }

    .eng:active {
      transform: scale(.95);
    }

    .eng.on {
      background: var(--acc);
      border-color: var(--acc);
      color: #fff;
      font-weight: 600;
      box-shadow: 0 10px 22px -10px rgba(91,63,140,.65);
    }

    .search {
      margin-top: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      border-radius: 999px;
      padding: 6px 6px 6px 18px;
      box-shadow: 0 14px 34px -20px rgba(64,40,110,.5);
    }

    .search .mag {
      width: 22px;
      height: 22px;
      flex: none;
      color: #9c92ad;
    }

    .search input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: 0;
      background: 0 0;
      font-size: 16px;
      color: var(--ink);
      padding: 10px 0;
      font-family: inherit;
    }

    .search input::placeholder {
      color: #8f8899;
    }

    #clearBtn {
      display: none;
      border: none;
      background: #efeaf4;
      color: #8d82a2;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-size: 14px;
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }

    .search .go {
      border: none;
      cursor: pointer;
      background: var(--acc);
      color: #fff;
      border-radius: 999px;
      padding: 0 22px;
      height: 42px;
      font-size: 15.5px;
      font-weight: 600;
      font-family: inherit;
      touch-action: manipulation;
    }

    .search .go:active {
      filter: brightness(.92);
    }

    /* ---------- 快捷方式网格 ---------- */
    .desk {
      margin-top: 32px;
      background: rgba(255,255,255,.52);
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 24px;
      padding: 20px 14px 14px;
      box-shadow: 0 18px 40px -28px rgba(64,40,110,.55);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4,minmax(0,1fr));
      row-gap: 18px;
      column-gap: 6px;
    }

    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .tile .circle {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #e9e4ef;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .15s;
      overflow: hidden;
    }

    .tile:active .circle {
      transform: scale(.9);
    }

    .tile .circle img {
      width: 30px;
      height: 30px;
      object-fit: contain;
      display: block;
    }

    .tile .letter {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      text-transform: uppercase;
    }

    .tile .name {
      max-width: 100%;
      font-size: 13px;
      font-weight: 500;
      color: #454050;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }

    .tile.add .circle {
      background: 0 0;
      border: 1.5px dashed rgba(91,63,140,.3);
      color: #9586ac;
      font-size: 26px;
      font-weight: 300;
      line-height: 1;
    }

    .tile.add .name {
      color: #9586ac;
    }

    /* ---------- 弹窗：添加/编辑、长按菜单 ---------- */
    .mask {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(50,32,80,.36);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      animation: fade .18s;
    }

    .mask[hidden] {
      display: none;
    }

    @keyframes fade {
      from {
        opacity: 0;
      }
    }

    .sheet {
      width: 100%;
      max-width: 520px;
      background: #fbf9fe;
      border-radius: 26px 26px 0 0;
      padding: 22px 20px calc(24px + env(safe-area-inset-bottom));
      animation: up .24s cubic-bezier(.2,.9,.3,1.15);
      max-height: 88dvh;
      overflow: auto;
    }

    @keyframes up {
      from {
        transform: translateY(36px);
        opacity: .3;
      }
    }

    .sheet h3 {
      margin: 0 0 18px;
      font-size: 18px;
      font-weight: 700;
    }

    .inp {
      width: 100%;
      padding: 13px 15px;
      margin-bottom: 12px;
      font-size: 15.5px;
      color: var(--ink);
      border: 1.5px solid #e6dff0;
      border-radius: 15px;
      background: #fff;
      outline: 0;
      font-family: inherit;
    }

    .inp:focus {
      border-color: var(--acc);
    }

    .icon-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 2px;
    }

    #icoBox {
      width: 52px;
      height: 52px;
      flex: none;
      border-radius: 16px;
      background: #fff;
      border: 1.5px solid #e6dff0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #icoBox img {
      width: 34px;
      height: 34px;
      object-fit: contain;
      display: block;
    }

    #icoBox .letter {
      width: 34px;
      height: 34px;
      font-size: 15px;
    }

    .chip {
      border: 1.5px solid #e6dff0;
      background: #fff;
      color: var(--mut);
      border-radius: 999px;
      padding: 10px 16px;
      font-size: 13.5px;
      font-family: inherit;
      cursor: pointer;
    }

    .chip.on {
      background: var(--acc);
      border-color: var(--acc);
      color: #fff;
      font-weight: 600;
    }

    .sheet-actions {
      display: flex;
      gap: 10px;
      margin-top: 22px;
    }

    .sheet-actions button {
      flex: 1;
      border: none;
      border-radius: 15px;
      padding: 14px 0;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }

    .sheet-actions .ghost {
      background: #efe9f6;
      color: var(--mut);
    }

    .sheet-actions .primary {
      background: var(--acc);
      color: #fff;
    }

    .menu-sheet {
      width: 100%;
      max-width: 520px;
      background: #fbf9fe;
      border-radius: 26px 26px 0 0;
      padding: 16px 14px calc(20px + env(safe-area-inset-bottom));
      animation: up .2s ease-out;
    }

    .m-head {
      font-size: 13px;
      color: var(--mut);
      padding: 2px 10px 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .menu-sheet button {
      display: block;
      width: 100%;
      border: none;
      background: #fff;
      color: var(--ink);
      font-size: 16px;
      padding: 15px;
      border-radius: 15px;
      margin-top: 8px;
      cursor: pointer;
      font-family: inherit;
    }

    .menu-sheet button.danger {
      color: #d9463f;
    }

    .menu-sheet button.ghostline {
      background: #efe9f6;
      color: var(--mut);
    }

    .tile {
      min-width: 0;
      transition: transform .18s cubic-bezier(.2,.9,.3,1.15);
    }

    .tile .name {
      width: 100%;
    }

    .tile.add[hidden] {
      display: none;
    }

    .menu-sheet button[hidden] {
      display: none;
    }

    /* ---------- 移动模式（底部栏 + 被选中的图标） ---------- */
    .movebar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 60;
      display: flex;
      gap: 14px;
      justify-content: center;
      padding: 10px 18px calc(14px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg,rgba(232,226,240,0) 0,rgba(232,226,240,.86) 34%,#e8e2f0 100%);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      animation: up .18s ease-out;
    }

    .movebar[hidden] {
      display: none;
    }

    .movebar .arrow {
      flex: 1;
      max-width: 200px;
      height: 58px;
      border: none;
      border-radius: 20px;
      background: var(--acc);
      color: #fff;
      font-size: 24px;
      font-weight: 700;
      font-family: inherit;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 16px 28px -16px rgba(91,63,140,.9);
      touch-action: manipulation;
      transition: transform .12s ease,opacity .12s ease,background .12s ease;
    }

    .movebar .arrow:active {
      transform: scale(.93);
    }

    .movebar .arrow:disabled {
      background: #b7abd0;
      opacity: .5;
      box-shadow: none;
      cursor: default;
      transform: none;
    }

    body.moving {
      padding-bottom: 96px;
    }

    body.moving .tile {
      cursor: default;
    }

    body.moving .tile:active .circle {
      transform: none;
    }

    .tile.lift {
      position: relative;
      z-index: 5;
      transform: translateY(-4px) scale(1.12);
    }

    .tile.lift .circle {
      background: #fff;
      box-shadow: 0 12px 22px -10px rgba(91,63,140,.6),0 0 0 2px rgba(91,63,140,.18);
    }

    .tile.lift .name {
      color: var(--acc);
      font-weight: 700;
    }

    /* ---------- PC 适配 ---------- */
    /* 通用：输入框可选中文字、键盘焦点轮廓、图标过渡 */
    input {
      user-select: text;
    }

    button:focus-visible {
      outline: 2px solid var(--acc);
      outline-offset: 2px;
    }

    .mvhint {
      display: none;
    }

    .tile .circle {
      transition: transform .15s,background .15s,box-shadow .15s;
    }

    /* 宽屏 ≥768px：更宽的容器、6 列网格、居中弹窗 */
    @media (min-width:768px) {
      main {
        max-width: 680px;
        padding-top: 7vh;
      }
      .brand {
        height: 150px;
      }
      .engines {
        margin-top: 26px;
      }
      .search {
        margin-top: 30px;
        padding: 8px 8px 8px 22px;
      }
      .search input {
        font-size: 17px;
      }
      .desk {
        margin-top: 44px;
        padding: 28px 20px 22px;
        border-radius: 28px;
      }
      .grid {
        grid-template-columns: repeat(6,minmax(0,1fr));
        row-gap: 26px;
        column-gap: 10px;
      }
      .tile .circle {
        width: 64px;
        height: 64px;
      }
      .tile .circle img {
        width: 34px;
        height: 34px;
      }
      .tile .letter {
        width: 34px;
        height: 34px;
        font-size: 17px;
      }
      .tile .name {
        font-size: 13.5px;
      }
      .mask {
        align-items: center;
      }
      .sheet,.menu-sheet {
        border-radius: 26px;
        max-width: 440px;
      }
      .menu-sheet {
        max-width: 360px;
      }
      .movebar {
        padding-bottom: 18px;
      }
      .movebar .arrow {
        flex: none;
        width: 88px;
        height: 48px;
        border-radius: 16px;
        font-size: 20px;
      }
      .mvhint {
        display: block;
        align-self: center;
        font-size: 13px;
        color: var(--mut);
        margin-left: 6px;
      }
      body.moving {
        padding-bottom: 110px;
      }
    }

    /* 超宽 ≥1200px：8 列 */
    @media (min-width:1200px) {
      main {
        max-width: 860px;
      }
      .grid {
        grid-template-columns: repeat(8,minmax(0,1fr));
      }
    }

    /* 有鼠标的设备：hover 效果 */
    @media (hover:hover) and (pointer:fine) {
      .eng:hover {
        border-color: var(--acc);
        color: var(--acc);
      }
      .eng.on:hover {
        color: #fff;
      }
      .search .go:hover {
        filter: brightness(1.1);
      }
      #clearBtn:hover {
        background: #e4dcee;
        color: var(--acc);
      }
      body:not(.moving) .tile:hover .circle {
        background: #fff;
        transform: translateY(-3px);
        box-shadow: 0 12px 22px -12px rgba(91,63,140,.55);
      }
      body:not(.moving) .tile:hover .name {
        color: var(--acc);
      }
      body:not(.moving) .tile.add:hover .circle {
        background: 0 0;
        box-shadow: none;
        border-color: var(--acc);
        color: var(--acc);
      }
      body:not(.moving) .tile:active .circle {
        transform: scale(.92);
      }
      .chip:hover {
        border-color: var(--acc);
        color: var(--acc);
      }
      .chip.on:hover {
        color: #fff;
      }
      .sheet-actions .ghost:hover,.menu-sheet button.ghostline:hover {
        background: #e6ddf0;
      }
      .sheet-actions .primary:hover,.movebar .arrow:hover:not(:disabled) {
        filter: brightness(1.1);
      }
      .menu-sheet button:hover {
        background: #f1ebf8;
      }
      .menu-sheet button.danger:hover {
        background: #fdeeed;
      }
    }

    /* ---------- 数据管理：右上角齿轮、弹窗、提示条 ---------- */
    .gear {
      position: fixed;
      top: calc(12px + env(safe-area-inset-top, 0px));
      right: calc(12px + env(safe-area-inset-right, 0px));
      z-index: 5;
      width: 40px;
      height: 40px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,.7);
      color: var(--mut);
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 2px 8px -4px rgba(91,63,140,.4);
    }

    .gear svg {
      width: 20px;
      height: 20px;
    }

    .gear:active {
      transform: scale(.92);
    }

    body.moving .gear {
      display: none;
    }

    .data-info {
      margin: -8px 0 14px;
      font-size: 13.5px;
      color: var(--mut);
    }

    .data-block {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .data-info + .data-block {
      margin-top: 0;
      padding-top: 0;
      border-top: 0;
    }

    .data-label {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .hint {
      margin: 8px 0 0;
      font-size: 12.5px;
      line-height: 1.5;
      color: var(--mut);
    }

    .data-block .sheet-actions {
      margin-top: 12px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(28px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      max-width: min(90vw, 420px);
      padding: 11px 18px;
      border-radius: 14px;
      background: rgba(50,32,80,.92);
      color: #fff;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
      z-index: 80;
      pointer-events: none;
      animation: fade .18s;
    }

    .toast[hidden] {
      display: none;
    }

    @media (hover:hover) and (pointer:fine) {
      .gear:hover {
        background: #fff;
        color: var(--acc);
      }
    }

    /* ---------- 键盘焦点：用 Tab 键选中快捷方式时显示轮廓 ---------- */
    .tile {
      outline: none;
    }

    .tile:focus-visible .circle {
      outline: 2px solid var(--acc);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <!-- 右上角：数据管理（导出/导入） -->
  <button type="button" class="gear" id="dataBtn" aria-label="数据管理（导出/导入）" title="数据管理">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>

  <main>
    <div class="brand" id="brand"></div>
    <div class="engines" id="engines"></div>

    <form class="search" id="searchForm" autocomplete="off">
      <svg class="mag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/>
        <path d="M16.5 16.5 21 21"/>
      </svg>
      <input id="q" type="text" placeholder="搜索，或输入网址回车直达" enterkeyhint="go">
      <button type="button" id="clearBtn" aria-label="清空">✕</button>
      <button type="button" class="go" id="searchBtn" title="用当前引擎搜索（回车则直达网址）">搜索</button>
    </form>

    <section class="desk">
      <div class="grid" id="grid"></div>
    </section>
  </main>

  <!-- 移动模式底部栏 -->
  <div class="movebar" id="mvBar" hidden>
    <button type="button" class="arrow" id="mvL" aria-label="向左移动">&lt;</button>
    <button type="button" class="arrow" id="mvR" aria-label="向右移动">&gt;</button>
    <span class="mvhint">← → 移动 · Enter/Esc 完成</span>
  </div>

  <!-- 添加/编辑快捷方式 -->
  <div class="mask" id="mask" hidden>
    <div class="sheet">
      <h3 id="sheetTitle">添加快捷方式</h3>
      <input id="fName" class="inp" type="text" placeholder="名称（可留空，自动用域名）">
      <input id="fUrl" class="inp" type="text" placeholder="输入网址，如 example.com" enterkeyhint="done">
      <div class="icon-row">
        <div id="icoBox"></div>
        <button type="button" class="chip" id="defaultBtn">默认图标</button>
        <button type="button" class="chip" id="pickBtn">自选图片</button>
      </div>
      <input id="fFile" type="file" accept="image/*" hidden>
      <div class="sheet-actions">
        <button type="button" class="ghost" id="cancelBtn">取消</button>
        <button type="button" class="primary" id="saveBtn">保存</button>
      </div>
    </div>
  </div>

  <!-- 数据管理：导出 / 导入 -->
  <div class="mask" id="dataMask" hidden>
    <div class="sheet">

  <script>
    /* ==========================================================
     * 启动主页：搜索框 + 快捷方式网格
     * 数据全部存在 localStorage（键名见 STORAGE_KEY），无任何外部依赖
     * ========================================================== */

    /* ---------- 常量 ---------- */
    const STORAGE_KEY = 'launcher_v3';
    const LONG_PRESS_MS = 520;      // 触屏长按多久弹出菜单
    const FAVICON_TIMEOUT_MS = 1800; // 单个 favicon 源的超时时间
    const SCHEME_RE = /^[a-z][a-z0-9+.-]*:\/\//i;
    const TOAST_MS = 3200;           // 提示条显示时长

    /* 搜索框里"像网址"的判断：主机[:端口][/路径]，主机可以是 localhost、IPv4、[IPv6] 或域名 */
    const OCTET = /(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)/.source;   // 0-255
    const IPV4 = `(?:${OCTET}\\.){3}${OCTET}`;
    const HOST_RE = new RegExp(
      `^(localhost|${IPV4}|\\[[0-9a-f:.]+\\]|(?:[a-z0-9-]+\\.)+[a-z]{2,})(?::(\\d{1,5}))?([/?#]\\S*)?$`, 'i');
    /* 没带方括号的 IPv6（::1、2001:db8::1）：至少两个冒号、只含十六进制和冒号 */
    const BARE_IPV6_RE = /^(?=(?:[^:]*:){2})[0-9a-f:]+(?:%\w+)?$/i;
    /* 看起来像域名后缀、其实多半是文件名/语言名的（node.js、main.py、readme.md…），不当网址 */
    const NOT_TLDS = new Set((
      'js mjs cjs ts tsx jsx json css scss less html htm xml php cpp hpp java cs txt log exe dll ' +
      'doc docx xls xlsx ppt pptx png jpg jpeg gif svg ico yml yaml toml ini conf sql lock bak tmp ' +
      'gz tar rar py md sh rs go rb kt'
    ).split(' '));

    /* 导出/导入 */
    const BACKUP_APP = 'start-page';       // 备份文件的标识，导入时用来认"自家"文件
    const BACKUP_VERSION = 1;              // 备份格式版本，以后改结构时靠它兼容
    const MAX_SHORTCUTS = 200;             // 快捷方式总数上限
    const MAX_FILE_BYTES = 8 * 1024 * 1024; // 单个备份文件大小上限
    const MAX_ICON_CHARS = 300000;         // 单个自选图标（dataURL）长度上限
    const ICON_DATA_RE = /^data:image\/(png|jpeg|webp|gif);base64,/i;

    /* 搜索引擎的 logo（内联 SVG，离线也能显示） */

      duckduckgo: '<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 32 32"><g transform="translate(-17.95 -5.06)scale(.26667)"><circle cx="127.33" cy="78.97" r="51.15" fill="#de5833"/><defs><path id="da" d="M178.68 78.82a51.4 51.4 0 0 1-51.35 51.36c-28.31 0-51.35-23.04-51.35-51.36s23.04-51.35 51.35-51.35a51.4 51.4 0 0 1 51.35 51.35"/></defs><clipPath id="db"><use xlink:href="#da"/></clipPath><g clip-path="url(#db)"><path fill="#d5d7d8" d="M148.3 155.16c-1.8-8.29-12.27-27.04-16.24-34.97s-7.93-19.1-6.13-26.32c.33-1.32-3.43-11.31-2.35-12.02 8.42-5.5 10.63.6 14-1.86 1.74-1.27 4.1 1.05 4.7-1.06 2.16-7.57-3-20.76-8.77-26.53-1.88-1.88-4.77-3.06-8.03-3.68q-1.86-2.59-6.14-4.88c-3.19-1.7-10.12-3.94-13.71-4.54-2.5-.4-3.06.29-4.12.46.99.09 5.7 2.41 6.61 2.55-.92.62-3.6-.03-5.32.74-.87.4-1.52 1.88-1.5 2.58 4.9-.5 12.56-.01 17.1 2-3.61.4-9.09.87-11.45 2.1-6.84 3.62-9.87 12.04-8.07 22.14 1.8 10.08 9.74 46.85 12.27 59.13 2.52 12.26-5.41 20.2-10.46 22.35l5.41.37-1.8 3.96c6.48.72 13.7-1.44 13.7-1.44-1.44 3.97-11.18 5.42-11.18 5.42s4.7 1.43 12.26-1.45l12.26-4.69 3.6 9.37 6.86-6.84 2.88 7.2c.02 0 5.43-1.81 3.62-10.1z"/><path fill="#fff" d="M150.47 153.48c-1.8-8.3-12.26-27.05-16.23-34.98s-7.93-19.11-6.13-26.32c.34-1.3.34-6.67 1.43-7.38 8.4-5.5 7.81-.19 11.19-2.65 1.74-1.27 3.13-2.8 3.74-4.91 2.16-7.57-3-20.76-8.78-26.53-1.88-1.88-4.76-3.06-8.02-3.69q-1.86-2.58-6.13-4.88c-5.4-2.86-12.07-4-18.26-2.88 1 .1 3.25 2.14 4.16 2.27-1.38.94-5.05.82-5.03 2.9 4.92-.5 10.3.28 14.84 2.3-3.6.4-6.96 1.3-9.3 2.54-6.86 3.6-8.66 10.81-6.86 20.91 1.81 10.1 9.75 46.88 12.26 59.13 2.53 12.26-5.4 20.19-10.45 22.35l5.4.36-1.8 3.98c6.5.72 13.7-1.44 13.7-1.44-1.44 3.97-11.17 5.4-11.17 5.4s4.68 1.44 12.25-1.44l12.27-4.7 3.6 9.38 6.86-6.85 2.9 7.22c-.02 0 5.39-1.8 3.58-10.1z"/><path fill="#2d4f8e" d="M109.02 70.69a3.79 3.79 0 1 1 7.57 0 3.79 3.79 0 0 1-7.57 0"/><path fill="#fff" d="M113.5 69.43a1 1 0 0 1 .99-.98.98.98 0 1 1-.98.98"/><path fill="#2d4f8e" d="M134.87 68.44a3.25 3.25 0 1 1 3.25 3.26 3.26 3.26 0 0 1-3.25-3.26"/><path fill="#fff" d="M138.73 67.36c0-.46.38-.84.83-.84a.84.84 0 0 1 .85.84c0 .47-.37.85-.85.85a.84.84 0 0 1-.84-.85"/><linearGradient id="dc" x1="105.32" x2="113.89" y1="60.98" y2="60.98" gradientUnits="userSpaceOnUse"><stop offset=".01" stop-color="#6176b9"/><stop offset=".69" stop-color="#394a9f"/></linearGradient><path fill="url(#dc)" d="M113.89 59.72s-2.86-1.3-5.63.45-2.67 3.52-2.67 3.52-1.48-3.28 2.45-4.89 5.84.92 5.84.92z"/><linearGradient id="dd" x1="132.27" x2="140.08" y1="58.37" y2="58.37" gradientUnits="userSpaceOnUse"><stop offset=".01" stop-color="#6176b9"/><stop offset=".69" stop-color="#394a9f"/></linearGradient><path fill="url(#dd)" d="M140.08 59.46s-2.05-1.17-3.65-1.15c-3.27.04-4.16 1.48-4.16 1.48s.55-3.44 4.73-2.75a4.2 4.2 0 0 1 3.08 2.42"/></g><path fill="#fdd20a" d="M124.4 85.3c.38-2.3 6.3-6.63 10.5-6.9 4.2-.26 5.5-.2 9-1.04s12.54-3.08 15.03-4.24c2.5-1.15 13.1.57 5.63 4.74-3.23 1.8-11.94 5.13-18.17 6.99-6.22 1.86-10-1.78-12.06 1.28-1.65 2.43-.33 5.76 7.1 6.45 10.04.93 19.66-4.52 20.72-1.62s-8.62 6.5-14.52 6.62c-5.9.1-17.77-3.9-19.56-5.14s-4.16-4.13-3.67-7.15z"/><path fill="#65bc46" d="M128.94 115.6s-14.1-7.53-14.33-4.48c-.24 3.06 0 15.5 1.64 16.45s13.4-6.1 13.4-6.1zm5.4-.48s9.64-7.29 11.76-6.82c2.1.48 2.58 15.5.7 16.23-1.88.7-12.9-3.81-12.9-3.81z"/><path fill="#43a244" d="M125.53 116.4c0 4.93-.7 7.05 1.4 7.52s6.1 0 7.52-.94.23-7.28-.23-8.46c-.48-1.18-8.7-.24-8.7 1.88z"/><path fill="#65bc46" d="M126.43 115.3c0 4.93-.71 7.04 1.4 7.51 2.1.48 6.1 0 7.52-.94 1.4-.94.23-7.28-.24-8.46-.47-1.17-8.7-.23-8.7 1.88z"/><circle cx="127.33" cy="78.97" r="57.5" fill="none" stroke="#de5833" stroke-width="5"/></g></svg>'
    };

    /* 搜索引擎：显示名 + 搜索地址前缀 */
    const ENGINES = {
      google:     { name: 'Google',     search: 'https://www.google.com/search?q=' },
      bing:       { name: 'Bing',       search: 'https://www.bing.com/search?q=' },
      duckduckgo: { name: 'DuckDuckGo', search: 'https://duckduckgo.com/?q=' }
    };

    /* ---------- 状态与持久化 ---------- */
    /* shortcuts 的每一项：{ id, name, url, icon: { type: 'auto' } | { type: 'custom', value: dataURL } } */
    const state = { engine: 'google', shortcuts: [] };

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved && ENGINES[saved.engine]) state.engine = saved.engine;
        if (saved && Array.isArray(saved.shortcuts)) {
          // 逐项校验：丢掉坏数据和 javascript: 之类的网址，保留原 id（去重）
          const seen = new Set();
          state.shortcuts = saved.shortcuts.slice(0, MAX_SHORTCUTS).map(raw => {
            const item = sanitizeShortcut(raw);
            if (!item) return null;
            if (typeof raw.id === 'string' && raw.id && !seen.has(raw.id)) item.id = raw.id;
            seen.add(item.id);
            return item;
          }).filter(Boolean);
        }
      } catch (e) { /* 数据损坏或存储不可用：用默认值 */ }
    }

    /* 成功返回 true；失败（存储满了/被禁用）返回 false，默认会弹提示 */
    function saveState({ silent = false } = {}) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        return true;
      } catch (e) {
        if (!silent) showToast('无法保存数据（存储空间不足或被禁用），建议先导出备份');
        return false;
      }
    }

    /* ---------- DOM 引用 ---------- */
    const $ = id => document.getElementById(id);

    const brandEl     = $('brand');
    const enginesEl   = $('engines');
    const gridEl      = $('grid');
    const searchForm  = $('searchForm');
    const queryInput  = $('q');
    const clearBtn    = $('clearBtn');

    const menuMask    = $('menuMask');   // 长按/右键菜单
    const sheetMask   = $('mask');       // 添加/编辑弹窗
    const nameInput   = $('fName');
    const urlInput    = $('fUrl');
    const iconBox     = $('icoBox');
    const fileInput   = $('fFile');

    const dataBtn     = $('dataBtn');    // 右上角齿轮
    const dataMask    = $('dataMask');   // 数据管理（导出/导入）弹窗
    const dataFile    = $('dataFile');
    const toastEl     = $('toast');

    const moveBar     = $('mvBar');      // 移动模式底部栏
    const moveLeftBtn = $('mvL');
    const moveRightBtn = $('mvR');

    /* ---------- 小工具 ---------- */
    const vibrate = ms => navigator.vibrate && navigator.vibrate(ms);

    /* 底部提示条 */
    let toastTimer = null;
    function showToast(message) {
      toastEl.textContent = message;
      toastEl.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toastEl.hidden = true; }, TOAST_MS);
    }

    /* 生成快捷方式 id（时间 + 随机 + 序号，批量导入也不会重复） */
    let idSeq = 0;
    function newId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 6) + (idSeq++).toString(36);
    }

    /* 点遮罩空白处关闭弹窗。
     * 但在弹窗里按下、拖到外面才松手（比如在输入框里拖选文字）不算，否则会丢掉正在填的内容 */
    function closeOnBackdropClick(mask, close) {
      let pressStartedInside = false;
      mask.addEventListener('pointerdown', ev => { pressStartedInside = ev.target !== mask; });
      mask.addEventListener('click', ev => {
        if (ev.target === mask && !pressStartedInside) close();
        pressStartedInside = false;
      });
    }

    /* 用来判断"是不是同一个网址"的规范化形式 */
    function urlKey(url) {
      try { return new URL(url).href; } catch (e) { return url; }
    }

    /* 跳转（稍微延迟一下，让按压动画能先播完） */
    function go(url) {
      setTimeout(() => { location.href = url; }, 30);
    }

    /* 在新标签页打开；被拦截时退回当前页跳转 */
    function openInNewTab(url) {
      window.open(url, '_blank') || go(url);
    }

    /* 取主机名：'https://www.a.com/x' -> 'a.com'；无效输入返回 '' */
    function hostOf(url) {
      try {
        return new URL(withScheme(url)).hostname.replace(/^www\./, '');
      } catch (e) {
        return '';
      }
    }

    /* 字符串 -> 0~359 的色相，保证同一个名字总是同一种颜色 */
    function hueOf(str) {
      let h = 0;
      for (let i = 0; i < str.length; i++) h = (31 * h + str.charCodeAt(i)) % 360;
      return h;
    }

    /* 把"主机[:端口][/路径]"形式的输入拆开检查，并决定没写协议时默认走 http 还是 https。
     * 不像网址（或主机/端口不合法）返回 null */
    function analyzeHost(input) {
      if (BARE_IPV6_RE.test(input) && input.includes('::') || /^(?:[0-9a-f]{1,4}:){7}[0-9a-f]{1,4}$/i.test(input)) {
        return { scheme: 'http', bareIPv6: true };
      }
      const m = HOST_RE.exec(input);
      if (!m) return null;

      const host = m[1].toLowerCase();
      const port = m[2];
      const isIPv4 = /^\d+(\.\d+){3}$/.test(host); // 已被 HOST_RE 限定为合法 0-255 的四段
      const isIPv6 = host.startsWith('[');
      const isLocal = host === 'localhost' || /\.(local|lan|home|internal|arpa)$/.test(host);

      if (port && (Number(port) < 1 || Number(port) > 65535)) return null;
      if (!isIPv4 && !isIPv6 && !isLocal && NOT_TLDS.has(host.split('.').pop())) return null;

      // 本机/内网地址、带非 443 端口的，多半没有 HTTPS，默认走 http
      const plainHttp = isIPv4 || isIPv6 || isLocal || (port && port !== '443');
      return { scheme: plainHttp ? 'http' : 'https' };
    }

    /* 补全协议：已有协议原样返回；否则按 analyzeHost 的判断补 http:// 或 https:// */
    function withScheme(input) {
      if (SCHEME_RE.test(input)) return input;
      const info = analyzeHost(input);
      if (info && info.bareIPv6) return 'http://[' + input + ']';
      return (info ? info.scheme : 'https') + '://' + input;
    }

    /* 搜索框回车用：输入像网址就返回可直接打开的完整网址，否则返回 null（交给搜索引擎）
     * 例：google.com、192.168.1.10:5000、localhost:3000、https://a.com/x -> 网址
     *     google、node.js、site:a.com、hello world -> null */
    function resolveUrl(text) {
      const input = text.trim();
      if (!input || /\s/.test(input)) return null;

      const hasScheme = /^https?:\/\//i.test(input);
      if (!hasScheme && !analyzeHost(input)) return null;
      try {
        return new URL(hasScheme ? input : withScheme(input)).href;
      } catch (e) {
        return null;
      }
    }

    /* ---------- 图标 ---------- */
    /* 没有图标时的占位：彩色圆 + 首字母 */
    function makeLetter(text, colorSeed) {
      const el = document.createElement('span');
      el.className = 'letter';
      el.style.background = `hsl(${hueOf(colorSeed || text || 'x')},55%,55%)`;
      el.textContent = (text || '?').trim().charAt(0).toUpperCase() || '?';
      return el;
    }

    /* 依次尝试多个 favicon 源，全部失败则调用 onFail */
    function loadFavicon(url, onLoad, onFail) {
      const host = hostOf(url);
      if (!host) { onFail(); return; }

      const sources = [`https://${host}/favicon.ico`, `https://favicon.im/${host}`];
      let next = 0;

      (function tryNext() {
        if (next >= sources.length) { onFail(); return; }

        const img = document.createElement('img');
        let settled = false;
        const settle = fn => {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          fn();
        };
        // 超时就放弃当前源，换下一个
        const timer = setTimeout(() => {
          settle(() => { img.removeAttribute('src'); tryNext(); });
        }, FAVICON_TIMEOUT_MS);

        img.onload  = () => settle(() => onLoad(img));
        img.onerror = () => settle(tryNext);
        img.src = sources[next++];
      })();
    }

    /* 构建某个快捷方式的图标：自选图片 > 在线 favicon > 首字母占位 */
    function buildIcon(item) {
      const wrap = document.createElement('div');
      const icon = item.icon || { type: 'auto' };

      if (icon.type === 'custom' && icon.value) {
        const img = document.createElement('img');
        img.alt = '';
        img.src = icon.value;
        wrap.appendChild(img);
        return wrap;
      }

      // 先放首字母占位，favicon 加载成功后再替换掉
      const host = hostOf(item.url);
      const letter = makeLetter(item.name || host, item.name || host || 'x');
      wrap.appendChild(letter);

      loadFavicon(item.url, img => {
        img.alt = '';
        if (letter.parentNode) letter.parentNode.removeChild(letter);
        wrap.appendChild(img);
      }, () => {});

      return wrap;
    }

    /* ---------- 渲染：logo / 引擎按钮 / 快捷方式网格 ---------- */
    function renderBrand() {
      let logo = brandEl.firstElementChild;
      if (!logo) {
        logo = document.createElement('div');
        brandEl.appendChild(logo);
      }
      if (logo.dataset.engine === state.engine) return; // 没变就不动
      logo.dataset.engine = state.engine;
      logo.className = 'logo ' + state.engine;
      logo.innerHTML = LOGOS[state.engine];
    }

    /* 引擎按钮只建一次；切换时只改高亮，不重建 */
    const engineBtns = {};
    function renderEngines() {
      if (!enginesEl.children.length) {
        Object.keys(ENGINES).forEach(key => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = ENGINES[key].name;
          btn.onclick = () => {
            if (state.engine === key) return;
            state.engine = key;
            saveState();
            renderBrand();
            renderEngines();
          };
          engineBtns[key] = btn;
          enginesEl.appendChild(btn);
        });
      }
      Object.keys(engineBtns).forEach(key => {
        const on = key === state.engine;
        engineBtns[key].className = 'eng' + (on ? ' on' : '');
        engineBtns[key].setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    }

    /* 一个快捷方式 = 圆形图标 + 名称。
     * 点击：打开；Ctrl/Shift/Cmd+点击、中键：新标签页；
     * 触屏长按、鼠标右键：弹出菜单 */
    function buildTile(item) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.dataset.sid = item.id;
      tile.tabIndex = 0;                 // 可用 Tab 键聚焦
      tile.setAttribute('role', 'link');
      tile.title = `${item.name || hostOf(item.url)} · ${item.url}`;

      const circle = document.createElement('div');
      circle.className = 'circle';
      circle.appendChild(buildIcon(item));
      tile.appendChild(circle);

      const label = document.createElement('div');
      label.className = 'name';
      label.textContent = item.name || hostOf(item.url);
      tile.appendChild(label);

      let pressing = false;     // 手指是否还按着
      let pressTimer = null;
      let menuJustOpened = false; // 刚弹出过菜单：吞掉随后那次 click，避免误打开网址

      const cancelPress = () => { pressing = false; clearTimeout(pressTimer); };

      tile.addEventListener('pointerdown', ev => {
        menuJustOpened = false;   // 新的一次按下，清掉上次的标记
        if (moving || ev.pointerType === 'mouse') return; // 鼠标不做长按，用右键
        pressing = true;
        pressTimer = setTimeout(() => {
          if (!pressing) return;
          menuJustOpened = true;
          vibrate(8);
          openMenu(item.id);
        }, LONG_PRESS_MS);
      });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(type => {
        tile.addEventListener(type, cancelPress);
      });

      // 打开网址：Ctrl/Shift/Cmd 修饰键 = 新标签页
      const open = ev => {
        if (ev.ctrlKey || ev.metaKey || ev.shiftKey) openInNewTab(item.url);
        else go(item.url);
      };

      tile.addEventListener('click', ev => {
        if (moving) return;
        if (menuJustOpened) { menuJustOpened = false; return; }
        open(ev);
      });

      // 键盘：聚焦后按 Enter / 空格打开（菜单键或 Shift+F10 走下面的 contextmenu）
      tile.addEventListener('keydown', ev => {
        if (moving || (ev.key !== 'Enter' && ev.key !== ' ')) return;
        ev.preventDefault();
        menuJustOpened = false;
        open(ev);
      });

      // 中键：先阻止"自动滚动"，再在 auxclick 里开新标签页
      tile.addEventListener('mousedown', ev => { if (ev.button === 1) ev.preventDefault(); });
      tile.addEventListener('auxclick', ev => {
        if (moving || ev.button !== 1) return;
        ev.preventDefault();
        openInNewTab(item.url);
      });

      tile.addEventListener('contextmenu', ev => {
        ev.preventDefault();
        if (moving) return;
        menuJustOpened = true;
        openMenu(item.id);
      });

      return tile;
    }

    /* 网格末尾的"+ 添加"按钮；移动模式下不显示 */
    function buildAddTile() {
      const tile = document.createElement('div');
      tile.className = 'tile add';
      tile.tabIndex = 0;
      tile.setAttribute('role', 'button');

      const circle = document.createElement('div');
      circle.className = 'circle';
      circle.textContent = '+';
      tile.appendChild(circle);

      const label = document.createElement('div');
      label.className = 'name';
      label.textContent = '添加';
      tile.appendChild(label);

      tile.onclick = () => openSheet(null);
      tile.addEventListener('keydown', ev => {
        if (ev.key !== 'Enter' && ev.key !== ' ') return;
        ev.preventDefault();
        openSheet(null);
      });
      return tile;
    }

    function renderGrid() {
      gridEl.innerHTML = '';
      state.shortcuts.forEach(item => gridEl.appendChild(buildTile(item)));
      if (!moving) gridEl.appendChild(buildAddTile());
    }

    function render() {
      renderBrand();
      renderEngines();
      renderGrid();
    }

    /* ---------- 长按/右键菜单 ---------- */
    let menuId = null; // 当前菜单对应的快捷方式 id

    function findShortcut(id) {
      return state.shortcuts.find(item => item.id === id);
    }

    function openMenu(id) {
      const item = findShortcut(id);
      if (!item) return;
      menuId = id;
      $('menuTitle').textContent = (item.name || hostOf(item.url)) + ' · ' + item.url;
      $('menuActions').hidden = false;
      $('mMove').hidden = state.shortcuts.length < 2; // 只有一个时没法排序
      menuMask.hidden = false;
    }

    function closeMenu() {
      menuMask.hidden = true;
      menuId = null;
    }

    closeOnBackdropClick(menuMask, closeMenu); // 点空白处关闭

    $('mNewTab').onclick = () => {
      const item = findShortcut(menuId);
      closeMenu();
      if (!item) return;
      // 先同步开一个空白页（不会被拦截），再改它的地址
      const win = window.open('about:blank', '_blank');
      if (!win) { go(item.url); return; }
      setTimeout(() => {
        try { win.location.href = item.url; } catch (e) { go(item.url); }
      }, 40);
    };

    $('mMove').onclick = ev => {
      ev.stopPropagation();
      startMove();
    };

    $('mEdit').onclick = () => {
      const item = findShortcut(menuId);
      closeMenu();
      if (item) openSheet(item);
    };

    $('mDel').onclick = () => {
      const id = menuId;
      closeMenu();
      if (!id) return;
      state.shortcuts = state.shortcuts.filter(item => item.id !== id);
      saveState();
      removeTile(id);
    };

    /* ---------- 添加/编辑弹窗 ---------- */
    let editingId = null;   // 正在编辑的 id；null 表示新增
    let iconMode = 'auto';  // 'auto'（自动图标）或 'custom'（自选图片）
    let customIcon = '';    // 自选图片的 dataURL
    let iconToken = 0;      // 每次刷新预览 +1，用来丢弃过期的异步结果
    let urlDebounce = null;

    /* 刷新弹窗里的图标预览 */
    function refreshIconPreview() {
      const token = ++iconToken; // 每次刷新都让之前未完成的异步结果作废
      iconBox.innerHTML = '';
      $('defaultBtn').classList.toggle('on', iconMode !== 'custom');
      $('pickBtn').classList.toggle('on', iconMode === 'custom');

      // 自选图片：直接显示
      if (iconMode === 'custom' && customIcon) {
        const img = document.createElement('img');
        img.src = customIcon;
        img.alt = '';
        iconBox.appendChild(img);
        return;
      }

      const url = urlInput.value.trim();
      const host = hostOf(url);

      // 编辑且网址没改：直接复用网格里已加载好的图标
      if (editingId) {
        const current = findShortcut(editingId);
        if (current && current.url === url) {
          const circle = tileEl(editingId)?.querySelector('.circle');
          if (circle && circle.firstChild) {
            iconBox.appendChild(circle.firstChild.cloneNode(true));
            return;
          }
        }
      }

      // 否则：先放首字母占位，再异步拉取 favicon
      iconBox.appendChild(makeLetter(nameInput.value || host, host));
      if (!host) return;

      loadFavicon(url, img => {
        if (token !== iconToken) return; // 期间输入又变了，丢弃
        iconBox.innerHTML = '';
        img.alt = '';
        iconBox.appendChild(img);
      }, () => {});
    }

    function openSheet(item) {
      editingId = item ? item.id : null;
      $('sheetTitle').textContent = item ? '编辑快捷方式' : '添加快捷方式';
      nameInput.value = (item && item.name) || '';
      urlInput.value = item ? item.url : '';

      const hasCustom = item && item.icon && item.icon.type === 'custom';
      iconMode = hasCustom && item.icon.value ? 'custom' : 'auto';
      customIcon = hasCustom ? item.icon.value : '';

      refreshIconPreview();
      sheetMask.hidden = false;
      if (!item) setTimeout(() => urlInput.focus(), 150); // 新增时直接聚焦网址框
    }

    function closeSheet() {
      iconToken++; // 弹窗关了，未完成的图标加载作废
      sheetMask.hidden = true;
      editingId = null;
      customIcon = '';
      iconMode = 'auto';
    }

    closeOnBackdropClick(sheetMask, closeSheet);
    $('cancelBtn').onclick = closeSheet;

    // 网址/名称变化 -> 刷新预览（网址输入做 220ms 防抖）
    urlInput.addEventListener('input', () => {
      if (iconMode !== 'auto') return;
      clearTimeout(urlDebounce);
      urlDebounce = setTimeout(refreshIconPreview, 220);
    });
    nameInput.addEventListener('input', () => {
      // 网址还没解析出域名时，占位字母跟着名称走
      if (iconMode === 'auto' && !hostOf(urlInput.value.trim())) refreshIconPreview();
    });

    $('defaultBtn').onclick = () => {
      customIcon = '';
      iconMode = 'auto';
      refreshIconPreview();
    };

    $('pickBtn').onclick = () => fileInput.click();

    /* 选图后：居中裁成正方形，缩到 128×128，存成 PNG dataURL */
    fileInput.addEventListener('change', function () {
      const file = this.files && this.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        const image = new Image();
        image.onload = () => {
          const SIZE = 128;
          const canvas = document.createElement('canvas');
          canvas.width = canvas.height = SIZE;
          const side = Math.min(image.width, image.height);
          canvas.getContext('2d').drawImage(
            image,
            (image.width - side) / 2, (image.height - side) / 2, side, side, // 源：中心正方形
            0, 0, SIZE, SIZE                                                  // 目标：整个画布
          );
          customIcon = canvas.toDataURL('image/png');
          iconMode = 'custom';
          refreshIconPreview();
        };
        image.onerror = () => showToast('无法读取这张图片，换一张试试');
        image.src = reader.result;
      };
      reader.onerror = () => showToast('无法读取这张图片，换一张试试');
      reader.readAsDataURL(file);
      this.value = ''; // 允许重复选择同一张图
    });

    $('saveBtn').onclick = () => {
      let url = urlInput.value.trim();
      if (!url) { urlInput.focus(); return; }

      if (!editingId && state.shortcuts.length >= MAX_SHORTCUTS) {
        showToast(`最多只能添加 ${MAX_SHORTCUTS} 个快捷方式`);
        return;
      }

      url = withScheme(url);
      try {
        const parsed = new URL(url);
        // 和导入、启动加载保持一致：只收 http/https，挡掉 javascript:、ftp: 等
        if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') {
          showToast('只支持 http / https 网址');
          urlInput.focus();
          return;
        }
        url = parsed.href;
      } catch (e) {
        urlInput.focus();
        return;
      }

      const name = nameInput.value.trim() || hostOf(url) || url;
      const icon = iconMode === 'custom' && customIcon
        ? { type: 'custom', value: customIcon }
        : { type: 'auto' };

      if (editingId) {
        const item = findShortcut(editingId);
        if (item) {
          const iconChanged = url !== item.url
            || JSON.stringify(icon) !== JSON.stringify(item.icon || { type: 'auto' });
          item.name = name;
          item.url = url;
          item.icon = icon;
          saveState();
          refreshTileName(item);
          if (iconChanged) refreshTileIcon(item);
        }
      } else {
        const item = {
          id: newId(),
          name,
          url,
          icon
        };
        state.shortcuts.push(item);
        saveState();
        insertTile(item);
      }
      closeSheet();
    };

    /* 回车保存（输入法选字时的回车不算） */
    [nameInput, urlInput].forEach(input => {
      input.addEventListener('keydown', ev => {
        if (ev.key === 'Enter' && !ev.isComposing && ev.keyCode !== 229) {
          ev.preventDefault();
          $('saveBtn').click();
        }
      });
    });

    /* ---------- 网格的局部更新（不整体重绘，避免图标重新加载） ---------- */
    function tileEl(id) {
      return [...gridEl.children].find(el => el.dataset && el.dataset.sid === id) || null;
    }

    function addTileEl() {
      return gridEl.querySelector(':scope > .tile.add');
    }

    function refreshTileName(item) {
      const label = tileEl(item.id)?.querySelector('.name');
      if (label) label.textContent = item.name || hostOf(item.url);
    }

    function refreshTileIcon(item) {
      const circle = tileEl(item.id)?.querySelector('.circle');
      if (!circle) return;
      circle.innerHTML = '';
      circle.appendChild(buildIcon(item));
    }

    function insertTile(item) {
      const tile = buildTile(item);
      const addTile = addTileEl();
      if (addTile) gridEl.insertBefore(tile, addTile); // 插在"+ 添加"前面
      else gridEl.appendChild(tile);
    }

    function removeTile(id) {
      const tile = tileEl(id);
      if (tile && tile.parentNode) tile.parentNode.removeChild(tile);
    }

    /* 按 state.shortcuts 的顺序重排 DOM（只移动节点，不重建） */
    function syncTileOrder() {
      state.shortcuts.forEach(item => {
        const tile = tileEl(item.id);
        if (tile) gridEl.appendChild(tile);
      });
      const addTile = addTileEl();
      if (addTile) gridEl.appendChild(addTile);
    }

    /* ---------- 移动模式：用 ← → 一格一格挪动选中的快捷方式 ---------- */
    let moving = false;
    let movingId = null;

    function indexOfShortcut(id) {
      return state.shortcuts.findIndex(item => item.id === id);
    }

    /* 到头了就禁用对应方向的按钮 */
    function updateMoveButtons() {
      const i = indexOfShortcut(movingId);
      moveLeftBtn.disabled = i <= 0;
      moveRightBtn.disabled = i < 0 || i >= state.shortcuts.length - 1;
    }

    function startMove() {
      const id = menuId;
      closeMenu();
      if (!id || state.shortcuts.length < 2) return;

      moving = true;
      movingId = id;
      document.body.classList.add('moving');
      moveBar.hidden = false;
      gridEl.style.minHeight = gridEl.offsetHeight + 'px'; // 隐藏"+ 添加"后高度别抖

      tileEl(id)?.classList.add('lift');
      const addTile = addTileEl();
      if (addTile) addTile.hidden = true;

      updateMoveButtons();
      vibrate(6);
    }

    function exitMove() {
      if (!moving) return;
      tileEl(movingId)?.classList.remove('lift');

      moving = false;
      movingId = null;
      document.body.classList.remove('moving');
      moveBar.hidden = true;
      gridEl.style.minHeight = '';

      const addTile = addTileEl();
      if (addTile) addTile.hidden = false;
    }

    /* 与左/右邻居交换位置（direction = -1 或 +1） */
    function moveStep(direction) {
      if (!moving) return;
      const from = indexOfShortcut(movingId);
      const to = from + direction;
      if (from < 0 || to < 0 || to >= state.shortcuts.length) return;

      const list = state.shortcuts;
      [list[from], list[to]] = [list[to], list[from]];
      saveState();
      syncTileOrder();
      updateMoveButtons();
      vibrate(8);
    }

    moveLeftBtn.onclick = ev => { ev.stopPropagation(); ev.preventDefault(); moveStep(-1); };
    moveRightBtn.onclick = ev => { ev.stopPropagation(); ev.preventDefault(); moveStep(1); };

    // 移动模式下，点底部栏以外的任何地方 = 完成（捕获阶段拦截，避免误触网址）
    document.addEventListener('click', ev => {
      if (!moving || moveBar.contains(ev.target)) return;
      ev.stopPropagation();
      ev.preventDefault();
      exitMove();
    }, true);

    /* ---------- 数据管理：导出 / 导入 ----------
     * 备份文件是一个 JSON：
     * { app, version, exportedAt, engine, shortcuts: [{ name, url, icon }] }
     * 自选图标以 dataURL 内嵌；自动图标只记 { type: 'auto' }，导入后重新抓取。
     * id 不导出，导入时重新生成。 */
    let importMode = 'merge'; // 'merge'（合并去重）或 'replace'（覆盖）

    const IMPORT_HINTS = {
      merge:   '按网址去重，保留本地已有的；可一次选多个文件。',
      replace: '用文件内容替换当前全部快捷方式（会先确认）；只能选一个文件。'
    };

    function setImportMode(mode) {
      importMode = mode;
      $('modeMerge').classList.toggle('on', mode === 'merge');
      $('modeReplace').classList.toggle('on', mode === 'replace');
      $('importHint').textContent = IMPORT_HINTS[mode];
    }

    function openDataSheet() {
      $('dataInfo').textContent = `当前共 ${state.shortcuts.length} 个快捷方式`;
      setImportMode('merge'); // 每次打开都回到更安全的"合并"
      dataMask.hidden = false;
    }

    function closeDataSheet() {
      dataMask.hidden = true;
    }

    dataBtn.onclick = openDataSheet;
    $('dataCloseBtn').onclick = closeDataSheet;
    closeOnBackdropClick(dataMask, closeDataSheet);
    $('modeMerge').onclick = () => setImportMode('merge');
    $('modeReplace').onclick = () => setImportMode('replace');

    /* 本地日期，如 2026-11-26 */
    function dateStamp() {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }

    function exportData() {
      if (!state.shortcuts.length) { showToast('还没有快捷方式可导出'); return; }

      const payload = {
        app: BACKUP_APP,
        version: BACKUP_VERSION,
        exportedAt: new Date().toISOString(),
        engine: state.engine,
        shortcuts: state.shortcuts.map(item => ({
          name: item.name,
          url: item.url,
          icon: item.icon && item.icon.type === 'custom' && item.icon.value
            ? { type: 'custom', value: item.icon.value }
            : { type: 'auto' }
        }))
      };

      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `launcher-backup-${dateStamp()}.json`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(link.href), 10000); // 给手机浏览器留足下载时间

      showToast(`已导出 ${state.shortcuts.length} 个快捷方式`);
    }

    $('exportBtn').onclick = exportData;

    /* 导入的文件是不可信输入：逐项清洗，不合格的丢掉。返回清洗后的新对象或 null */
    function sanitizeShortcut(raw) {
      if (!raw || typeof raw.url !== 'string') return null;

      let url = withScheme(raw.url.trim());
      try {
        const parsed = new URL(url);
        // 只允许 http/https，挡掉 javascript: 之类
        if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') return null;
        url = parsed.href;
      } catch (e) {
        return null;
      }

      const name = typeof raw.name === 'string' ? raw.name.trim().slice(0, 100) : '';
      const icon = raw.icon && raw.icon.type === 'custom' && typeof raw.icon.value === 'string'
          && raw.icon.value.length <= MAX_ICON_CHARS && ICON_DATA_RE.test(raw.icon.value)
        ? { type: 'custom', value: raw.icon.value }
        : { type: 'auto' };

      return { id: newId(), name: name || hostOf(url) || url, url, icon };
    }

    /* 解析一个备份文件的文本；格式不对就抛出带中文原因的 Error */
    function parseBackup(text) {
      let data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        throw new Error('不是有效的 JSON 文件');
      }
      if (!data || typeof data !== 'object' || data.app !== BACKUP_APP) {
        throw new Error('不是本主页导出的备份文件');
      }
      if (!Number.isInteger(data.version) || data.version < 1) {
        throw new Error('备份文件缺少有效的版本号');
      }
      if (data.version > BACKUP_VERSION) {
        throw new Error('备份文件版本较新，请先更新主页');
      }
      if (!Array.isArray(data.shortcuts)) {
        throw new Error('文件里没有快捷方式数据');
      }

      const items = [];
      let invalid = 0;
      data.shortcuts.forEach(raw => {
        const item = sanitizeShortcut(raw);
        if (item) items.push(item); else invalid++;
      });
      return { engine: data.engine, items, invalid };
    }

    async function importFiles(fileList, mode) {
      const files = [...fileList]; // 先复制：之后 input 会被清空
      if (!files.length) return;
      if (mode === 'replace' && files.length > 1) {
        showToast('覆盖模式一次只能选一个文件');
        return;
      }

      // 1) 读取并清洗所有文件
      const incoming = [];
      let invalid = 0;
      let badFiles = 0;
      let engine = null;
      let firstError = '';
      for (const file of files) {
        try {
          if (file.size > MAX_FILE_BYTES) throw new Error('文件太大（超过 8 MB）');
          const parsed = parseBackup(await file.text());
          incoming.push(...parsed.items);
          invalid += parsed.invalid;
          engine = engine || parsed.engine;
        } catch (e) {
          badFiles++;
          firstError = firstError || e.message;
        }
      }
      if (!incoming.length) {
        showToast(firstError || (invalid ? `没有有效的快捷方式（${invalid} 个无效项）` : '文件里没有快捷方式'));
        return;
      }

      // 2) 按网址去重，得出新的列表（覆盖模式从空列表开始）
      const list = mode === 'replace' ? [] : state.shortcuts.slice();
      const seen = new Set(list.map(item => urlKey(item.url)));
      let added = 0;
      let duplicates = 0;
      let overLimit = 0;
      for (const item of incoming) {
        const key = urlKey(item.url);
        if (seen.has(key)) duplicates++;
        else if (list.length >= MAX_SHORTCUTS) overLimit++;
        else { list.push(item); seen.add(key); added++; }
      }

      if (mode === 'merge' && !added) {
        showToast(duplicates ? `没有新增，${duplicates} 个已存在` : '没有可导入的快捷方式');
        return;
      }
      if (mode === 'replace'
          && !confirm(`将用文件中的 ${added} 个快捷方式替换当前的 ${state.shortcuts.length} 个，确定吗？`)) {
        return;
      }

      // 3) 应用并保存；保存失败就回滚
      const backup = { engine: state.engine, shortcuts: state.shortcuts };
      state.shortcuts = list;
      if (mode === 'replace' && ENGINES[engine]) state.engine = engine; // 搜索引擎只在覆盖时恢复
      if (!saveState({ silent: true })) {
        state.engine = backup.engine;
        state.shortcuts = backup.shortcuts;
        showToast('存储空间不足，导入未生效');
        return;
      }
      render();
      closeDataSheet();

      const parts = [mode === 'replace' ? `已覆盖，共 ${added} 个快捷方式` : `新增 ${added} 个`];
      if (duplicates) parts.push(`跳过 ${duplicates} 个重复`);
      if (overLimit) parts.push(`${overLimit} 个超出 ${MAX_SHORTCUTS} 个上限`);
      if (invalid) parts.push(`忽略 ${invalid} 个无效项`);
      if (badFiles) parts.push(`${badFiles} 个文件无法读取`);
      showToast(parts.join('，'));
    }

    $('importBtn').onclick = () => {
      dataFile.multiple = importMode === 'merge';
      dataFile.click();
    };
    dataFile.addEventListener('change', () => {
      importFiles(dataFile.files, importMode).finally(() => { dataFile.value = ''; });
    });

    /* ---------- 搜索框 ----------
     * 回车（含手机键盘的"前往"键）：像网址就直达，否则用当前引擎搜索
     * 点"搜索"按钮：不管内容是什么，一律用当前引擎搜索（比如就是想搜 google.com） */
    function runSearch(forceSearch) {
      const text = queryInput.value.trim();
      if (!text) { queryInput.focus(); return; }

      const direct = forceSearch ? null : resolveUrl(text);
      go(direct || ENGINES[state.engine].search + encodeURIComponent(text));
    }

    // 表单只有一个输入框、没有提交按钮：回车会触发 submit，输入法的"前往"键也走这条路
    searchForm.addEventListener('submit', ev => {
      ev.preventDefault();
      runSearch(false);
    });
    $('searchBtn').onclick = () => runSearch(true);

    queryInput.addEventListener('input', () => {
      clearBtn.style.display = queryInput.value ? 'block' : 'none';
    });

    clearBtn.onclick = () => {
      queryInput.value = '';
      clearBtn.style.display = 'none';
      queryInput.focus();
    };

    /* ---------- 全局键盘快捷键（主要给 PC 用） ---------- */
    document.addEventListener('keydown', ev => {
      const key = ev.key;
      const inInput = ev.target && ev.target.tagName === 'INPUT';

      // Esc：按"最上层"的顺序关闭 移动模式 > 添加弹窗 > 数据弹窗 > 菜单
      if (key === 'Escape' || key === 'Esc') {
        if (moving) exitMove();
        else if (!sheetMask.hidden) closeSheet();
        else if (!dataMask.hidden) closeDataSheet();
        else if (!menuMask.hidden) closeMenu();
        return;
      }

      // 移动模式：← → 挪动，Enter 完成
      if (moving) {
        if (inInput) return;
        if (key === 'ArrowLeft')  { ev.preventDefault(); moveStep(-1); }
        if (key === 'ArrowRight') { ev.preventDefault(); moveStep(1); }
        if (key === 'Enter')      { ev.preventDefault(); exitMove(); }
        return;
      }

      // "/"：聚焦搜索框（没有弹窗、且不在输入框里时）
      if (key === '/' && !inInput && sheetMask.hidden && menuMask.hidden && dataMask.hidden
          && !ev.ctrlKey && !ev.metaKey && !ev.altKey) {
        ev.preventDefault();
        queryInput.focus();
      }
    });

    /* ---------- 启动 ---------- */
    loadState();
    render();

    /* ---------- 离线缓存 / PWA ---------- */
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    // 有鼠标的设备：打开页面就能直接打字搜索
    if (window.matchMedia && matchMedia('(hover:hover) and (pointer:fine)').matches) {
      queryInput.focus();
    }
  </script>
</body>
</html>
